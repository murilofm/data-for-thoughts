name: Testar páginas no navegador
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publicar subprojetos"]
    types: [completed]
permissions:
  contents: read
jobs:
  navegador:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar as páginas da revisão
        run: python3 tools/build.py
      - name: Instalar a ferramenta de verificação
        run: npm install --prefix "$RUNNER_TEMP/dft-browser" --no-save --no-audit --no-fund playwright@1.56.1
      - name: Exercitar o arquivo e as visualizações
        run: |
          python3 -m http.server 8175 --bind 127.0.0.1 > "$RUNNER_TEMP/dft-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          export CHROME_BIN="$(command -v google-chrome)"
          export NODE_PATH="$RUNNER_TEMP/dft-browser/node_modules"
          node tools/verify-browser.cjs
