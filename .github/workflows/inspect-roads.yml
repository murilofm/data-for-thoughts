name: Recover the public 2012 highway dataset
on:
  push:
    branches: [restore-road-data]
    paths: ['.github/workflows/inspect-roads.yml', 'projects/acidentes-nas-rodovias-federais/build.py']
permissions: {contents: write}
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python projects/acidentes-nas-rodovias-federais/build.py
      - name: Save extracted quantitative data on this branch
        run: |
          git add -- projects/acidentes-nas-rodovias-federais/trechos-2012.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Recover road segments from the original published map'
            git push origin HEAD:restore-road-data
          fi
